name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    name: Test GUI and build Windows app
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
      - name: Install locked GUI and development dependencies
        run: uv sync --locked --extra dev --extra gui --extra stt --python 3.13
      - name: Run desktop tests
        run: uv run --locked --python 3.13 --extra dev --extra gui --extra stt pytest tests/unit/gui tests/unit/test_gui_launcher.py
      - name: Install packaging tool
        run: uv pip install --python .venv/Scripts/python.exe pyinstaller==6.22.3
      - name: Build Windows application
        run: .venv/Scripts/python.exe scripts/build_gui.py
      - name: Archive application folder
        run: Compress-Archive -Path 'dist/ElevenLabs Toolkit' -DestinationPath 'dist/ElevenLabs-Toolkit-Windows.zip'
      - name: Test extracted application without an API request
        shell: pwsh
        run: |
          $extracted = Join-Path $env:RUNNER_TEMP 'elevenlabs-windows-smoke'
          Expand-Archive -LiteralPath 'dist/ElevenLabs-Toolkit-Windows.zip' -DestinationPath $extracted
          $executable = Join-Path $extracted 'ElevenLabs Toolkit/ElevenLabs Toolkit.exe'
          $app = Start-Process -FilePath $executable -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Desktop self-test failed with exit code $($app.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ElevenLabs-Toolkit-Windows
          path: dist/ElevenLabs-Toolkit-Windows.zip
          if-no-files-found: error

  macos-package:
    name: Build and smoke-test macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
      - name: Install locked application dependencies
        run: uv sync --locked --no-dev --extra gui --extra stt --python 3.13
      - name: Install packaging tool
        run: uv pip install --python .venv/bin/python pyinstaller==6.22.3
      - name: Build app bundle
        run: .venv/bin/python scripts/build_gui.py
      - name: Archive app bundle with macOS metadata
        run: ditto -c -k --keepParent 'dist/ElevenLabs Toolkit.app' 'dist/ElevenLabs-Toolkit-macOS.zip'
      - name: Test extracted app without an API request
        run: |
          extracted=$(mktemp -d "$RUNNER_TEMP/elevenlabs-macos-smoke.XXXXXX")
          ditto -x -k 'dist/ElevenLabs-Toolkit-macOS.zip' "$extracted"
          QT_QPA_PLATFORM=offscreen "$extracted/ElevenLabs Toolkit.app/Contents/MacOS/ElevenLabs Toolkit" --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: ElevenLabs-Toolkit-macOS
          path: dist/ElevenLabs-Toolkit-macOS.zip
          if-no-files-found: error

  gui:
    name: Desktop tests (Python 3.13)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt runtime library
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
      - name: Install GUI dependencies
        run: uv sync --locked --extra dev --extra stt --extra gui --python 3.13
      - name: Run desktop tests
        run: |
          uv run --locked --python 3.13 --extra dev --extra stt --extra gui python -c "import PySide6.QtWidgets"
          uv run --locked --python 3.13 --extra dev --extra stt --extra gui pytest tests/unit/gui tests/unit/test_gui_launcher.py

  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --extra dev --extra stt --python "${{ matrix.python-version }}"

      - name: Lint
        run: uv run --locked --python "${{ matrix.python-version }}" --extra dev --extra stt ruff check .

      - name: Check formatting
        run: uv run --locked --python "${{ matrix.python-version }}" --extra dev --extra stt ruff format --check .

      - name: Type check
        run: uv run --locked --python "${{ matrix.python-version }}" --extra dev --extra stt mypy src

      - name: Test
        run: uv run --locked --python "${{ matrix.python-version }}" --extra dev --extra stt pytest

      - name: Smoke-test direct Python script
        run: uv run --locked --python "${{ matrix.python-version }}" --extra dev --extra stt python run_toolkit.py --help

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
