name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --extra dev --extra stt --python "${{ matrix.python-version }}"

      - name: Lint
        run: uv run --locked --extra dev --extra stt ruff check .

      - name: Check formatting
        run: uv run --locked --extra dev --extra stt ruff format --check .

      - name: Type check
        run: uv run --locked --extra dev --extra stt mypy src

      - name: Test
        run: uv run --locked --extra dev --extra stt pytest

      - name: Smoke-test direct Python script
        run: uv run --locked --extra dev --extra stt python run_toolkit.py --help

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
