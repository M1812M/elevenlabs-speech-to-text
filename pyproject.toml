[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elevenlabs-toolkit"
version = "0.1.0"
description = "ElevenLabs transcription and transcript transformation toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "elevenlabs",
  "tqdm",
  "python-dotenv",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
elevenlabs-transcribe = "elevenlabs_toolkit.cli.transcribe:main"
elevenlabs-transform = "elevenlabs_toolkit.cli.transform:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
