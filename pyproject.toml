[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elevenlabs-toolkit"
version = "0.2.0a1"
description = "A typed, CLI-first ElevenLabs transcription and post-production toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Matthias Mertens", email = "mertens.m@outlook.com" },
]
keywords = ["audio", "elevenlabs", "speech-to-text", "subtitles", "transcription"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
stt = [
  "elevenlabs>=2.53,<3",
]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.urls]
Repository = "https://github.com/M1812M/elevenlabs-speech-to-text"
Issues = "https://github.com/M1812M/elevenlabs-speech-to-text/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elevenlabs_toolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/languages/test_uzbek_processor.py" = ["RUF001"]

[tool.mypy]
python_version = "3.10"
files = ["src/elevenlabs_toolkit"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.uv]
required-version = "==0.11.28"

[tool.elevenlabs-toolkit]
profile = "standard"
